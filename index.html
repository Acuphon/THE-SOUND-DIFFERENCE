      });
      this.$$('[data-pair]').forEach(b => b.addEventListener('click', () => {
        [this.lower,this.higher] = b.dataset.pair.split(',').map(Number); this.pairChanged();
      }));
      this.$$('[data-mode]').forEach(b => b.addEventListener('click', () => {
        if (this.mode === b.dataset.mode) return;
        this.stop(); this.mode = b.dataset.mode; this.side = 'a';
        this.$('#auto').checked = false;
        this.volume = Math.min(this.volume,35); this.$('#volume').value = this.volume;
        this.updateVolume(); this.update(); this.announce('Listening mode changed. Playback paused.');
      }));
      this.$$('[data-side]').forEach(b => b.addEventListener('click', () => {
        this.side = b.dataset.side; this.updateGain(); this.updatePlayer(); this.resetAuto();
        this.announce(this.sideDescription());
      }));
      this.$('#play').addEventListener('click', () => { if (this.playing) this.stop(); else this.start(); });
      this.$('#auto').addEventListener('change', () => this.resetAuto());
      this.$('#source').addEventListener('change', e => {
        this.stop(); this.sound = e.target.value; this.sourceLevel = SOURCE_LEVELS[this.sound]; this.$('#source-level').value = this.sourceLevel; this.update();
        this.announce('Sound sample changed. Press play to listen.');
      });
      this.$('#assist').addEventListener('change', e => {
        this.stop(); this.assisted = e.target.checked; this.update();
        this.announce('Listening scale changed. Playback paused.');
      });
      this.$('#source-level').addEventListener('input', e => {
        this.sourceLevel = Number(e.target.value); this.updateScenario(); this.updateGain();
      });
      this.$('#volume').addEventListener('input' , e => { this.volume = Number(e.target.value); this.updateVolume(); });
      this.update();
    }

    pairChanged() {
      // The common listening reference changes between pairs. Pause to avoid an
      // unexpected level jump and make the new comparison deliberate.
      this.stop(); this.side = 'a'; this.update();
      this.announce(`${ratingName(this.lower)} versus ${this.higher} decibels. ${pct((1-energyRatio(this.higher-this.lower))*100)} percent less energy in the illustration. Playback paused.`);
      this.emit('comparison_change');
    }

    update() {
      const delta = this.higher - this.lower;
      const remaining = 100 * energyRatio(delta);
      const saving = pct(100 - remaining);
      this.$('#lower').innerHTML = RATINGS.filter(n => n < 60).map(n => `<option value="${n}"${n === this.lower ? ' selected' : ''}>${n === 0 ? 'No door · open doorway' : `${n} dB Rw`}</option>`).join('');
      this.$('#higher').innerHTML = RATINGS.filter(n => n > 0).map(n => `<option value="${n}"${n === this.higher ? ' selected' : ''}>${n === 0 ? 'No door · open doorway' : `${n} dB Rw`}</option>`).join('');
      this.$$('[data-pair]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pair === `${this.lower},${this.higher}`)));
      this.$('#headline-db').textContent = `${delta} dB.`;
      this.$('#saving').textContent = saving;
      this.$('#basis').textContent = `Illustrative ${this.lower === 0 ? "no door" : `${this.lower} dB`} → ${this.higher} dB comparison.`;
      this.$('#bar-a-label').textContent = ratingName(this.lower);
      this.$('#bar-b-label').textContent = ratingName(this.higher);
      const remainingText = remaining.toFixed(remaining < .1 ? 6 : 1).replace(/(\.\d*?[1-9])0+$|\.0+$/, '$1');
      this.$('#bar-b-value').textContent = `${remainingText}%`;
      this.$('#bar-b').style.width = `${remaining}%`;
      this.$('#energy-chart').setAttribute('aria-label', `Illustrative transmitted sound energy: ${ratingName(this.lower)} is the 100 percent reference; ${this.higher} dB is ${remainingText} percent of that reference.`);
      this.$('#explanation').innerHTML = `The step from <strong>${this.lower === 0 ? "no door" : `${this.lower} dB`} to ${this.higher} dB</strong> cuts the energy still getting through by another <strong>${saving}%</strong> in this model. That is why the last few decibels deserve your attention.`;
      this.$('#delta').textContent = `+${delta} dB`;
      this.$$('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === this.mode)));
      this.$('.metric').classList.toggle('long', this.lower === 0);
      this.$('#room-controls').hidden = !this.roomMode();
      this.$('#mode-note').innerHTML = !this.roomMode()
        ? `<strong>Exact ${delta} dB difference, amplified equally.</strong> Both examples use the same source. Playback is not calibrated to a real room.`
        : this.assisted
          ? `<strong>Audible preview · 3:1 listening scale.</strong> The selected sound stays audible, without added background hiss. The displayed dB values describe the example, not your device’s playback level.`
          : `<strong>Full-range audio.</strong> Full reduction is applied to the selected source. “After” may be very faint. Keep your device volume fixed.`;
      this.updateScenario();
      this.updatePlayer();
    }

    roomMode() { return this.mode === 'before' || this.lower === 0; }

    exampleRoomLevel(rating) {
      return 10 * Math.log10(10 ** ((this.sourceLevel - rating) / 10) + 10 ** (ROOM_LEVEL / 10));
    }

    updateScenario() {
      this.$('#source-level-value').textContent = `${this.sourceLevel} dB`;
      this.$('#level-before').innerHTML = `${Math.round(this.exampleRoomLevel(0))} <small>dB</small>`;
      this.$('#level-after').innerHTML = `≈${Math.round(this.exampleRoomLevel(this.higher))} <small>dB</small>`;
      this.$('#level-after-label').textContent = `After · ${this.higher} dB door`;
      const residual = this.sourceLevel - this.higher;
      this.$('#scenario-note').textContent = `Illustrative room level: ${residual} dB residual source + assumed ${ROOM_LEVEL} dB background (calculation only; not played). Uniform reduction is assumed; this is not a measured or predicted room result.`;
    }

    sideDescription() {
      return !this.roomMode()
        ? `Door ${this.side.toUpperCase()}: ${this.side === 'a' ? this.lower : this.higher} dB Rw`
        : this.side === 'a' ? `No door: ${this.sourceLevel} dB example` : `After: approximately ${Math.round(this.exampleRoomLevel(this.higher))} dB example room`;
    }

    updatePlayer() {
      this.$('#label-a').textContent = !this.roomMode() ? 'Door A' : 'Before · open doorway';
      this.$('#label-b').textContent = !this.roomMode() ? 'Door B · upgrade' : 'After · Door B';
      this.$('#value-a').innerHTML = !this.roomMode() ? `${this.lower} <small>dB Rw</small>` : 'No door';
      this.$('#value-b').innerHTML = `${this.higher} <small>dB Rw</small>`;
      this.$$('[data-side]').forEach(b => {
        b.setAttribute('aria-pressed', String(b.dataset.side === this.side));
        b.querySelector('.live').textContent = this.playing ? 'Listening' : 'Selected';
      });
      this.$('#play').innerHTML = icon(this.playing ? 'pause' : 'play') + `<span>${this.playing ? 'Pause audio' : 'Play comparison'}</span>`;
      this.$('#play').setAttribute('aria-label', this.playing ? 'Pause audio' : 'Play comparison');
      this.$('#scope-label').textContent = this.playing ? this.sideDescription() : 'Press play to listen';
      this.draw();
    }

    updateVolume() {
      this.$('#volume-value').textContent = `${this.volume}%`;
      this.$('#volume').setAttribute('aria-valuetext', `${this.volume} percent`);
      this.updateGain();
    }

    targetGain() {
      const attenuation = this.side === 'a' ? 0 : this.roomMode() ? this.higher : this.higher - this.lower;
      const scale = this.roomMode() && this.assisted ? 3 : 1;
      const headroom = this.roomMode() ? .7 : 1;
      return (this.volume / 100) * headroom * amplitude(attenuation / scale);
    }

    updateGain() {
      if (!this.ctx || !this.gain || !this.playing) return;
      this.gain.gain.cancelScheduledValues(this.ctx.currentTime);
      this.gain.gain.setTargetAtTime(this.targetGain(), this.ctx.currentTime, 0.025);
    }

    async getAudioBuffer(kind) {
      if (kind !== 'conversation') return this.getBuffer(kind);
      if (this.buffers.has(kind)) return this.buffers.get(kind);
      const bytes = Uint8Array.from(atob(CONVERSATION_MP3), c => c.charCodeAt(0));
      const buffer = await this.ctx.decodeAudioData(bytes.buffer);
      let peak=0;
      for (let ch=0;ch<buffer.numberOfChannels;ch++) for (const n of buffer.getChannelData(ch)) peak=Math.max(peak,Math.abs(n));
      for (let ch=0;ch<buffer.numberOfChannels;ch++) {
        const data=buffer.getChannelData(ch);
        for(let i=0;i<data.length;i++) data[i] *= .85 / Math.max(peak,.001);
      }
      this.buffers.set(kind,buffer); return buffer;
    }

    async start() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.showError('Audio is unavailable in this browser. The visual comparison still works.'); return; }
      const token = ++this.generation;
      this.$('#play').disabled = true;
      this.$('#error').hidden = true;
      try {
        if (!this.ctx) this.ctx = new AC();
        await this.ctx.resume();
        if (token !== this.generation || !this.isConnected) return;
        if (this.ctx.state !== 'running') throw new Error('Audio context did not start');
        const buffer = await this.getAudioBuffer(this.sound);
        if (token !== this.generation || !this.isConnected) return;
        this.gain = this.ctx.createGain();
        this.gain.gain.value = 0;
        this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 2048;
        this.samples = new Float32Array(this.analyser.fftSize);
        this.sourceNode = this.ctx.createBufferSource();
        this.sourceNode.buffer = buffer; this.sourceNode.loop = true;
        this.sourceNode.connect(this.gain); this.gain.connect(this.analyser); this.analyser.connect(this.ctx.destination);
        document.dispatchEvent(new CustomEvent('silentdoor-player-started',{detail:this}));
        this.sourceNode.start(); this.playing = true; this.updateGain(); this.updatePlayer(); this.resetAuto();
        this.animate(); this.announce(`Playing. ${this.sideDescription()}.`); this.emit('audio_play');
      } catch (_) {
        this.stop(); this.showError('Audio could not start. Try Play again, or use the visual comparison.');
      } finally { this.$('#play').disabled = false; }
    }

    stop() {
      this.generation++;
      clearInterval(this.autoTimer); this.autoTimer = null;
      cancelAnimationFrame(this.animation);
      const ctx = this.ctx, src = this.sourceNode, gain = this.gain, analyser = this.analyser;
      this.playing = false; this.sourceNode = null;
      if (src && ctx && ctx.state !== 'closed') {
        try {
          gain.gain.cancelScheduledValues(ctx.currentTime);
          gain.gain.setTargetAtTime(0,ctx.currentTime,0.012);
          src.stop(ctx.currentTime + 0.065);
          src.onended = () => { src.disconnect(); gain.disconnect(); analyser.disconnect(); };
        } catch (_) { src.disconnect(); gain.disconnect(); analyser.disconnect(); }
      }
      if (this.$('#play')) { this.$('#play').disabled = false; this.updatePlayer(); }
    }

    resetAuto() {
      clearInterval(this.autoTimer); this.autoTimer = null;
      if (this.playing && this.$('#auto').checked) this.autoTimer = setInterval(() => {
        this.side = this.side === 'a' ? 'b' : 'a';
        this.updateGain(); this.updatePlayer(); this.announce(this.sideDescription());
      },4000);
    }

    getBuffer(kind) {
      if (this.buffers.has(kind)) return this.buffers.get(kind);
      if (!['music','hum'].includes(kind)) throw new Error('Unsupported generated sample');
      const sr = this.ctx.sampleRate, seconds = 8, length = Math.round(sr * seconds);
      const buffer = this.ctx.createBuffer(1,length,sr), d = buffer.getChannelData(0);
      let seed = 19771011, mid = 0;
      const rand = () => { seed = (Math.imul(seed,1664525)+1013904223)>>>0; return seed/2147483648-1; };
      const melody = [261.6256,329.6276,391.9954,493.8833,440,391.9954,329.6276,293.6648,261.6256,329.6276,440,523.2511,493.8833,391.9954,329.6276,293.6648];
      const bassNotes = [130.8128,110,87.3071,97.9989];
      let peak = 0;
      for(let i=0;i<length;i++) {
        const t=i/sr, white=rand();
        mid=.96*mid+.04*white;
        let v;
        if(kind==='hum') {
          v=.28*Math.sin(2*Math.PI*100*t)+.15*Math.sin(2*Math.PI*200*t)+.09*Math.sin(2*Math.PI*400*t)+.06*Math.sin(2*Math.PI*800*t);
          v*=.9+.1*Math.sin(2*Math.PI*2*t);
        } else {
          const beat=t%.5, half=t%.25, phrase=Math.floor(t/2), note=melody[Math.floor(t/.5)%16];
          const env=(1-Math.exp(-beat*110))*Math.exp(-beat*6.5);
          const lead=env*(Math.sin(2*Math.PI*note*t)+.25*Math.sin(2*Math.PI*note*2*t)+.09*Math.sin(2*Math.PI*note*3*t))*.18;
          const bass=.18*Math.sin(2*Math.PI*bassNotes[phrase]*t)*(1-Math.exp(-beat*100))*Math.exp(-beat*3);
          const kick=.35*Math.sin(2*Math.PI*(54*beat+6*(1-Math.exp(-beat*28))))*Math.exp(-beat*22);
          const snare=Math.floor(t/.5)%2 ? white*.16*Math.exp(-beat*30) : 0;
          const hat=(white-mid)*.075*Math.exp(-half*65);
          v=lead+bass+kick+snare+hat;
        }
        // Tiny identical edge fades remove loop clicks, with no per-door processing.
        const edge=Math.min(1,i/(sr*.012),(length-1-i)/(sr*.012));
        d[i]=v*edge; peak=Math.max(peak,Math.abs(d[i]));
      }
      const scale=.85/Math.max(peak,.001);
      for(let i=0;i<length;i++) d[i]*=scale;
      this.buffers.set(kind,buffer); return buffer;
    }

    draw() {
      const canvas=this.$('canvas'); if(!canvas) return;
      const box=canvas.getBoundingClientRect(); if(!box.width) return;
      const scale=Math.min(window.devicePixelRatio||1,2), width=box.width,height=80;
      if(canvas.width!==Math.round(width*scale)||canvas.height!==height*scale){canvas.width=Math.round(width*scale);canvas.height=height*scale;}
      const c=canvas.getContext('2d'); if(!c) return;
      c.setTransform(scale,0,0,scale,0,0);c.clearRect(0,0,width,height);
      c.strokeStyle='#4c4554';c.lineWidth=1;c.beginPath();c.moveTo(0,40);c.lineTo(width,40);c.stroke();
      if(!this.playing||!this.analyser)return;
      this.analyser.getFloatTimeDomainData(this.samples);
      c.strokeStyle=this.side==='b'?'#f4a0c3':'#f57b9e';c.lineWidth=1.8;c.beginPath();
      // Fixed vertical scale: lower output actually draws a smaller waveform.
      for(let x=0;x<width;x++){const i=Math.floor(x/width*this.samples.length),y=40-this.samples[i]*105;if(x===0)c.moveTo(x,y);else c.lineTo(x,y);}
      c.stroke();
    }

    animate() {
      cancelAnimationFrame(this.animation);
      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(reduce){this.draw();return;}
      const tick=()=>{if(!this.playing)return;this.draw();this.animation=requestAnimationFrame(tick);};
      this.animation=requestAnimationFrame(tick);
    }

    announce(text) { this.$('#status').textContent=text; }
    showError(text) { this.$('#error').textContent=text; this.$('#error').hidden=false; }
    emit(action) {
      // Opt-in integration hook only: no requests, cookies or built-in tracking.
      this.dispatchEvent(new CustomEvent('silentdoor:interaction',{bubbles:true,composed:true,detail:{action,lower:this.lower,higher:this.higher,mode:this.mode,sound:this.sound}}));
    }
  }
  customElements.define('silentdoor-comparison',SilentDoorComparison);
})();

</script>
<div class="preview-footer">Illustrative audio experience · No microphone access or audio downloads needed.</div>
</body></html>
